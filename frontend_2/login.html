<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yana OS | Secure Login</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0f172a',    primary: '#4f46e5',
                            accent: '#10b981',  alert: '#f43f5e',
                            surface: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .input-field { transition: all 0.3s ease; }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); border-color: #4f46e5; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOut 0.4s ease forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen w-screen overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none"></div>

    <div class="flex h-full w-full">
        <!-- Left Side: Branding (Hidden on mobile) -->
        <div class="hidden lg:flex flex-col justify-between w-1/2 bg-brand-dark p-12 relative overflow-hidden">
            <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-primary rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-brand-accent rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            
            <div class="relative z-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-primary rounded-lg flex items-center justify-center shadow-lg">
                    <i data-lucide="layers" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Yana OS</h1>
            </div>

            <div class="relative z-10 mb-20">
                <h2 class="text-4xl lg:text-5xl font-bold text-white leading-tight mb-6">
                    Enterprise <br/>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">Operations Engine.</span>
                </h2>
                <p class="text-slate-400 text-lg max-w-md">
                    Secure access to your centralized project management, timesheets, and financial analytics.
                </p>
            </div>

            <div class="relative z-10 text-sm text-slate-500 font-medium">
                &copy; <span id="year"></span> Yana OS Platform. All rights reserved.
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
            <div class="w-full max-w-md">
                
                <div class="flex lg:hidden items-center gap-3 mb-10 justify-center">
                    <div class="w-10 h-10 bg-brand-dark rounded-lg flex items-center justify-center shadow-lg">
                        <i data-lucide="layers" class="text-white w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Yana OS</h1>
                </div>

                <div class="mb-10 text-center lg:text-left">
                    <h3 class="text-3xl font-bold text-slate-900 mb-2 tracking-tight">Welcome back</h3>
                    <p class="text-slate-500">Please enter your credentials to access the system.</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="user" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="text" id="username" name="username" required
                                class="input-field w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 outline-none focus:bg-white transition-colors"
                                placeholder="Enter your unique ID" autocomplete="username">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                class="input-field w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 outline-none focus:bg-white transition-colors"
                                placeholder="••••••••" autocomplete="current-password">
                            
                            <!-- Show Password Toggle Feature -->
                            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-primary transition-colors focus:outline-none">
                                <i id="eye-icon" data-lucide="eye" class="h-5 w-5"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="login-btn"
                        class="w-full bg-brand-primary hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center mt-4">
                        <span id="btn-text">Sign In Securely</span>
                        <i id="btn-spinner" data-lucide="loader-2" class="hidden h-5 w-5 animate-spin"></i>
                    </button>
                </form>
                
                <div class="mt-8 text-center text-sm text-slate-400">
                    <i data-lucide="shield-check" class="inline-block w-4 h-4 mr-1"></i>
                    Encrypted & Monitored Access
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        lucide.createIcons();

        const CONFIG = {
            API_BASE_URL: 'http://localhost:8000', 
            TOKEN_KEY: 'yana_os_token'
        };

        // --- UI Utilities ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let iconSvg = ''; let bgColor = '';
            
            if (type === 'error') { bgColor = 'bg-brand-alert'; iconSvg = `<i data-lucide="alert-circle" class="w-5 h-5 text-white"></i>`; } 
            else if (type === 'success') { bgColor = 'bg-brand-accent'; iconSvg = `<i data-lucide="check-circle-2" class="w-5 h-5 text-white"></i>`; } 
            else { bgColor = 'bg-slate-800'; iconSvg = `<i data-lucide="info" class="w-5 h-5 text-white"></i>`; }

            toast.className = `toast-enter flex items-center p-4 rounded-lg shadow-lg text-white pointer-events-auto ${bgColor}`;
            toast.innerHTML = `<div class="mr-3">${iconSvg}</div><div class="font-medium text-sm flex-1">${message}</div><button onclick="this.parentElement.remove()" class="ml-4 opacity-80 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-exit'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) { return null; }
        }

        // --- Auth Submission ---
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            if (!usernameInput.value.trim() || !passwordInput.value) {
                showToast("Please enter both username and password.", "error");
                return;
            }

            submitBtn.disabled = true; submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.classList.add('hidden'); btnSpinner.classList.remove('hidden');

            const formData = new URLSearchParams();
            formData.append('username', usernameInput.value.trim());
            formData.append('password', passwordInput.value);

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const data = await response.json().catch(() => ({}));
                
                if (!response.ok) {
                    throw new Error(data.detail || data.error || "Authentication failed");
                }

                if (data.access_token) {
                    sessionStorage.setItem(CONFIG.TOKEN_KEY, data.access_token);
                    showToast("Authentication successful! Redirecting...", "success");
                    
                    const decoded = parseJwt(data.access_token);
                    
                    // Route to correct portal based on role
                    setTimeout(() => {
                        if (decoded && decoded.role && decoded.role.toLowerCase() === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'employee.html';
                        }
                    }, 800);
                }
            } catch (error) {
                showToast(error.message, "error");
                submitBtn.disabled = false; submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnText.classList.remove('hidden'); btnSpinner.classList.add('hidden');
            }
        });

        // Redirect if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = sessionStorage.getItem(CONFIG.TOKEN_KEY);
            if (token) {
                const decoded = parseJwt(token);
                if (decoded && decoded.exp * 1000 > Date.now()) {
                    window.location.href = decoded.role.toLowerCase() === 'admin' ? 'admin.html' : 'employee.html';
                } else {
                    sessionStorage.removeItem(CONFIG.TOKEN_KEY);
                }
            }
        });
    </script>
</body>
</html>
